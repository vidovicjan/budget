# Builds the Windows installer and publishes it as a GitHub Release when a version tag is pushed.
#   npm run ship        (bumps the patch version, commits, tags and pushes)
# or by hand:
#   git tag v1.3.1 && git push --tags
# Installed apps pick the new release up through electron-updater.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $v. Bump the version first."
            exit 1
          fi

      - run: npm ci

      - name: Build and publish
        run: npm run build && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
